# Robô do controle de licitações, às 06:30, 12:30 e 18:00 (Brasília). O GitHub pode atrasar alguns minutos.
# Também dá para rodar na hora em Actions → "Horário da disputa" → Run workflow.
#  1. PNCP           — scripts/pncp_robo.py   (mesma busca do botão "Atualizar do PNCP")
#  2. Alerta         — scripts/alerta_robo.py (precisa do segredo ALERTA_TOKEN; sem ele, é pulado)
#  3. DNIT           — scripts/dnit.py        (consulta oficial de editais do DNIT, Superintendência de MG)
#  4. DER-MG         — scripts/der.py         (concorrências de der.mg.gov.br)
#  depois: triagem_documentos.py (lê edital/TR/planilhas das obras que o objeto não denuncia)
#          horario_disputa.py    (lê o horário da disputa nos editais)
#          preencher_edital.py   (atestados e garantia de proposta: % e valor, lidos do edital/TR)
name: Horário da disputa

on:
  schedule:
    - cron: "30 9,15 * * *"   # 06:30 e 12:30 em Brasília
    - cron: "0 21 * * *"      # 18:00 em Brasília
  workflow_dispatch:

jobs:
  ler-editais:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0 openpyxl==3.1.5
      - name: PNCP
        working-directory: scripts
        run: python pncp_robo.py
        continue-on-error: true
      - name: Alerta Licitação
        working-directory: scripts
        run: python alerta_robo.py
        env:
          ALERTA_TOKEN: ${{ secrets.ALERTA_TOKEN }}
        continue-on-error: true
      - name: Editais do DNIT (MG)
        working-directory: scripts
        run: python dnit.py
        continue-on-error: true
      - name: Concorrências do DER-MG
        working-directory: scripts
        run: python der.py
        continue-on-error: true
      - name: Triagem pelos documentos
        working-directory: scripts
        run: python triagem_documentos.py
        continue-on-error: true   # se falhar, o horário da disputa ainda roda
      - name: Horário da disputa
        run: python scripts/horario_disputa.py
        continue-on-error: true
      - name: Atestados e garantia de proposta
        working-directory: scripts
        run: python preencher_edital.py
